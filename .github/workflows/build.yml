name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'

      - name: Add cabal bin to PATH
        run: echo "$HOME/.cabal/bin" >> $GITHUB_PATH

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-agda-2.8.0-ghc-9.6.7-v2

      - name: Install Agda 2.8.0
        run: |
          cabal update
          cabal install Agda-2.8.0 --overwrite-policy=always

      - name: Verify Agda installation
        run: agda --version

      - name: Checkout agda-stdlib v2.4
        run: |
          git clone --depth 1 \
            --branch v2.4 \
            https://github.com/agda/agda-stdlib.git

      - name: Checkout agda-categories (master for stdlib 2.4 compatibility)
        run: |
          git clone --depth 1 \
            --branch master \
            https://github.com/agda/agda-categories.git

      - name: Register Agda libraries
        run: |
          mkdir -p ~/.config/agda
          echo "$(pwd)/agda-stdlib/standard-library.agda-lib" >> ~/.config/agda/libraries
          echo "$(pwd)/agda-categories/agda-categories.agda-lib" >> ~/.config/agda/libraries
          echo "standard-library" >> ~/.config/agda/defaults
          echo "agda-categories" >> ~/.config/agda/defaults

      - name: List registered libraries (debug)
        run: |
          echo "=== ~/.config/agda/libraries ==="
          cat ~/.config/agda/libraries || true
          echo "=== ~/.config/agda/defaults ==="
          cat ~/.config/agda/defaults || true

      - name: Type-check project
        run: agda src/Everything.agda
