name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.4'
          cabal-version: '3.10.3.0'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-agda-2.8.0-ghc-9.6.4-v2

      - name: Install Agda 2.8.0
        run: |
          cabal update
          cabal install Agda-2.8.0 --overwrite-policy=always

      - name: Checkout agda-stdlib
        run: |
          git clone --depth 1 \
            --branch v2.4 \
            https://github.com/agda/agda-stdlib.git

      - name: Checkout agda-categories
        run: |
          git clone --depth 1 \
            --branch v0.3.0 \
            https://github.com/agda/agda-categories.git

      - name: Patch agda-categories dependency
        run: |
          sed -i 's/standard-library-2.3/standard-library/' \
            agda-categories/agda-categories.agda-lib

      - name: Register libraries
        run: |
          mkdir -p ~/.config/agda
          echo "$(pwd)/agda-stdlib/standard-library.agda-lib" >> ~/.config/agda/libraries
          echo "$(pwd)/agda-categories/agda-categories.agda-lib" >> ~/.config/agda/libraries
          echo "standard-library" >> ~/.config/agda/defaults
          echo "agda-categories" >> ~/.config/agda/defaults

      - name: Type-check everything
        run: agda src/Everything.agda
