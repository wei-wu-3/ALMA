name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Agda
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.8.0'

      - name: Checkout agda-stdlib
        run: |
          git clone --depth 1 \
            --branch v2.4 \
            https://github.com/agda/agda-stdlib.git

      - name: Checkout agda-categories
        run: |
          git clone --depth 1 \
            --branch v0.3.0 \
            https://github.com/agda/agda-categories.git

      - name: Type-check everything
        run: |
          agda -i src \
               -i agda-stdlib/src \
               -i agda-categories/src \
               src/Everything.agda
